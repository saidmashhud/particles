<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>particles — verlet + quadtree</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0a0a0f; color: #cbd5e1;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      #app { position: relative; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        position: absolute; top: 12px; left: 12px; padding: 12px 14px;
        background: rgba(15, 23, 42, 0.78); border: 1px solid #1e293b;
        border-radius: 8px; font-size: 13px; line-height: 1.7; min-width: 220px;
      }
      .hud b { color: #7dd3fc; }
      .hud label { display: block; margin-top: 8px; color: #94a3b8; }
      .hud input[type="range"] { width: 100%; }
      .hint { margin-top: 10px; color: #64748b; font-size: 11px; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div class="hud">
        <div>fps: <b id="fps">—</b></div>
        <div>частиц: <b id="count">—</b></div>
        <label>количество: <span id="countVal"></span></label>
        <input id="slider" type="range" min="1000" max="14000" step="500" value="10000" />
        <div class="hint">мышь: притяжение · shift+мышь: отталкивание</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
